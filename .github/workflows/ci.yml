name: CI

on:
  pull_request:
  push:
    branches: [main, 'hotfix/**']

permissions:
  contents: read

# A later push to a pull request cancels its earlier run. A push to a release branch never
# cancels another: every commit on a release branch needs its own CI result for the release
# gate. Each push run gets a group of its own, since a shared group would still cancel a
# pending run when a third push arrives.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The trierarch's tmux adapter is tested against the real tmux.
      - run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      # The trierarch's systemd unit is tested against a real systemd user
      # manager, here only: on a developer's machine it is the one a live
      # trierarch runs under. Lingering starts the runner's own.
      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 30); do
            state=$(XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running || true)
            case "$state" in running | degraded) exit 0 ;; esac
            sleep 1
          done
          echo "the systemd user manager is ${state:-unreachable}" >&2
          exit 1
      - run: npm run typecheck
      - run: npm run lint
      - id: tests
        run: npm run test:unit
        env:
          AEOLUS_TEST_USER_SYSTEMD: '1'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - name: Check Docker test leftovers
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node scripts/check-test-run-leftovers.ts docker
      - name: Check Podman test leftovers
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node scripts/check-test-run-leftovers.ts podman

  go:
    # The Go trierarch (docs/design/trierarch-binary.md), built beside today's.
    name: Go format, vet, staticcheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt lists no file
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go test -race ./...

  go-macos:
    # The Go trierarch's service on macOS: the launchd agent and the log it
    # caps, where launchd lives. On pushes only, as trierarch-macos.
    name: Go service tests on macOS
    if: github.event_name == 'push'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -race -v ./internal/service ./internal/logfile

  trierarch-macos:
    # The trierarch and the aeolus-fleet plugin's scripts run on macOS too, where
    # Linux CI misses their regressions: BSD awk and sed for the scripts. On
    # pushes only: a macOS runner costs about 10 times the minutes. The unit
    # layer only: the runner has no Docker for the integration layer's
    # Testcontainers.
    name: Trierarch and plugin unit tests on macOS
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The trierarch's tmux adapter is tested against the real tmux.
      - run: command -v tmux || brew install tmux
      - run: npx vitest run --project trierarch:unit --project plugin:unit --project scripts:unit
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  guardrails:
    # The CI checks in scripts/. Every check runs, so one failure does not hide the next.
    name: Guardrails
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request checks read every commit between base and head.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - id: install
        run: npm ci
      - name: npm only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-package-manager.ts
      - name: Every test file belongs to a Vitest project
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-test-projects.ts
      - name: Every use case has a test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-use-case-tests.ts
      - name: TDD evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node scripts/check-tdd-evidence.ts "$BASE_SHA" "$HEAD_SHA"
      - name: No em dash
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node scripts/check-em-dash.ts "$BASE_SHA" "$HEAD_SHA"

  integration:
    # Runs the trierarch's, the plugin's and the contract suite's integration tests against Postgres
    # and the trierarch built from source, so it runs when changed-paths finds what they read changed.
    name: Integration tests (Postgres in Testcontainers)
    needs: changed-paths
    if: ${{ always() && (needs.changed-paths.result != 'success' || needs.changed-paths.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require changed paths result
        if: ${{ needs.changed-paths.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # The contract suite's upgrade tests build the Go trierarch of the next version for the suite's own GitHub Release.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: npm ci
      # The images Testcontainers starts, from the Actions cache.
      - uses: ./.github/actions/test-images
      # Ubuntu's pasta AppArmor profile blocks Podman's network teardown.
      # Allow only the missing SIGTERM receive rule, as upstream documents:
      # https://github.com/actions/runner-images/issues/15182
      - name: Allow Podman to stop its rootless network helper
        run: |
          if [ -f /etc/apparmor.d/usr.bin.pasta ]; then
            sudo sed -i '$ i\  signal (receive) set=(term) peer=podman,' /etc/apparmor.d/usr.bin.pasta
            sudo apparmor_parser -r /etc/apparmor.d/usr.bin.pasta
          fi
      - id: tests
        run: npm run test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - name: Check Docker test leftovers
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node scripts/check-test-run-leftovers.ts docker

  changed-paths:
    # Decides whether a pull request runs the contract and the integration jobs: only when a path
    # the job reads changed. Every push runs both, main and a release branch alike. The jobs skip
    # by an `if` on the job, never a workflow path filter: a skipped job counts as passed for a
    # required check, where a skipped workflow leaves it pending.
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.paths.outputs.contract }}
      integration: ${{ steps.paths.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [[ "$EVENT" != pull_request ]]; then
            printf 'contract=true\nintegration=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$BASE" "$HEAD")

          # What both jobs read: the runner, the Go trierarch they build, the suite and its stand-ins.
          shared=(
            # npm ci installs from it, so a dependency change reaches every suite.
            package.json
            # It pins the core and the tools the suites run against.
            package-lock.json
            # Vitest's projects, set-up files and timeouts.
            vitest.config.ts
            # esbuild reads the compiler options when Vitest transforms a test.
            tsconfig.json
            # The compiler options tsconfig.json and the trierarch's build extend.
            tsconfig.base.json
            # Every project's first global setup.
            scripts/support/test-folders.global-setup.ts
            # The run's temporary folders that setup makes.
            scripts/support/test-folders.ts
            # The images Testcontainers starts.
            .github/actions/test-images/action.yml
            # The jobs' own steps and these lists.
            .github/workflows/ci.yml
            # The suite's global setup builds the Go trierarch of the next version.
            go/
            # The suite, its fleet, machine and stand-in harnesses.
            contract/
            # The suite builds this trierarch with npm run build, which compiles src without its tests.
            packages/trierarch/src/
            # A unit test in src is no part of that build.
            ':(exclude,glob)packages/trierarch/src/**/*.test.ts'
            # The package the build runs from, with its dependencies.
            packages/trierarch/package.json
            # The build's compiler settings and what it includes.
            packages/trierarch/tsconfig.build.json
            # The suite runs the stand-in harnesses from here.
            packages/trierarch/test/support/
            # The stand-in harnesses run the plugin's scripts, and the trierarch calls them.
            plugins/aeolus-fleet/scripts/
            # The trierarch and the suite read each harness's plugin manifest for its version.
            plugins/aeolus-fleet/.claude-plugin/
            # Codex's manifest, read the same way.
            plugins/aeolus-fleet/.codex-plugin/
            # Copilot's manifest, read the same way.
            plugins/aeolus-fleet/.github/plugin/
          )

          # What only the integration job reads: the trierarch's and the plugin's own integration tests.
          integration=(
            # The trierarch's integration tests, their fixtures and their stand-ins.
            packages/trierarch/test/
            # The plugin's integration test against a real fleet.
            plugins/aeolus-fleet/test/delivery.integration.test.ts
            # The environment that test runs the scripts in.
            plugins/aeolus-fleet/test/script-environment.ts
            # The set-up file of the plugin's integration project.
            plugins/aeolus-fleet/test/foreign-harness.setup.ts
          )

          # Whether a path of the list differs between where the branch left main and its head.
          changed() {
            local status=0
            git diff --quiet "$base" "$HEAD" -- "$@" || status=$?
            case "$status" in
              0) printf 'false' ;;
              1) printf 'true' ;;
              *) exit "$status" ;;
            esac
          }
          contract=$(changed "${shared[@]}")
          integration=$(changed "${shared[@]}" "${integration[@]}")
          printf 'contract=%s\nintegration=%s\n' "$contract" "$integration" >> "$GITHUB_OUTPUT"

  contract-go:
    # The contract suite's parts the Go trierarch is built to so far, driven against its binary.
    name: Contract tests on the Go trierarch
    needs: changed-paths
    if: ${{ always() && (needs.changed-paths.result != 'success' || needs.changed-paths.outputs.contract == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require changed paths result
        if: ${{ needs.changed-paths.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: npm ci
      - uses: ./.github/actions/test-images
      # A version of its own, as a release's is, so it and today's trierarch take over each other's holds, and above every version the tests seed, as a release's is; MAJOR.MINOR.PATCH, the only versions upgrade takes.
      - run: go build -ldflags "-X github.com/ThomasHendrickx/aeolus-fleet-trierarch/go/internal/cli.Version=0.99.0" -o "$RUNNER_TEMP/aeolus-trierarch" ./cmd/aeolus-trierarch
        working-directory: go
      # The upgrade tests build the Go trierarch of the next version for the suite's own GitHub Release, with go on PATH.
      - id: tests
        run: npm run test:contract:go
        env:
          AEOLUS_TRIERARCH_UNDER_TEST: ${{ runner.temp }}/aeolus-trierarch
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - name: Check Docker test leftovers
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node scripts/check-test-run-leftovers.ts docker

  session-image:
    # The image a trierarch runs container sessions from (decision 0039), built
    # as release.yml builds it, with a throwaway prerelease version so the
    # plugin in it carries the image's version, then smoke-tested in rootless
    # Podman as a session runs it.
    name: Session image
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0-ci.${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run set-version -- "$VERSION"
      - run: podman build --file packages/trierarch/image/Containerfile --build-arg VERSION="$VERSION" --tag localhost/aeolus-session:ci .
      - run: packages/trierarch/image/test/smoke-test.sh podman localhost/aeolus-session:ci "$VERSION"

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The same steps as release.yml, with a throwaway prerelease version:
      # 0.0.0 is already on npm, and npm requires a tag for a prerelease.
      - run: npm run set-version -- "0.0.0-ci.${{ github.run_id }}"
      - run: npm run build
      - run: npm publish --dry-run --access public --tag dry-run --workspace @aeolus-fleet/trierarch
