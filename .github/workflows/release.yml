# Publishes @aeolus-fleet/trierarch to npm, pushes the session image
# (decision 0039) to ghcr.io with that version, and tags v<version> a commit
# with the aeolus-fleet plugin's version on top of the released commit, so a version
# on npm always matches a tag in git and the tag holds the plugin of that
# version (aeolus-trierarch upgrade installs it from there). Before it publishes,
# it attests the Go trierarch's binary for each system and chip
# (aeolus-trierarch-<goos>-<goarch>, built and tested by go-binaries.yml where
# it runs), a GitHub artifact attestation per binary, signed here: upgrade takes
# only an attestation signed by this file. After the tag, finish-release.yml,
# called with this run's id, creates the GitHub Release with this run's
# binaries and their SHA256SUMS, closes the release's milestone, sets the
# aeolus-fleet plugin to the version on main and, for a release from main,
# writes the Homebrew formula to the tap. When a run stops after its tag,
# dispatch finish-release.yml with the version and this run's id: the version
# cannot be published or tagged again.
#
# The only way the package can be published: npm trusted publishing (OIDC) is
# configured for exactly this file name, and tokens are disallowed (decision
# 0011). Never add an NPM_TOKEN or any other npm secret. Provenance is automatic.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the trierarch, the aeolus-fleet plugin and the session image, MAJOR.MINOR.PATCH
        required: true
        type: string

permissions:
  id-token: write
  # To push the release tag, create its GitHub Release, and push the plugin's version to main.
  contents: write
  # To read the merged pull requests carrying the release's label, for its notes.
  pull-requests: read
  # To read CI's result for the released commit.
  actions: read
  # To push the session image to ghcr.io.
  packages: write
  # To attest each Go binary, with id-token above.
  attestations: write
  # To read the release's milestone and close it.
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    name: Go binaries ${{ inputs.version }}
    permissions:
      contents: read
    uses: ./.github/workflows/go-binaries.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Publish ${{ inputs.version }}
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Plain releases only: npm needs a dist-tag for a prerelease, which this workflow does not set.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the version is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag v$VERSION already exists: that version was released before"
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Could not read the tags from origin (git ls-remote exited $status)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@^11.5.1
          fi
          npm --version

      - run: npm ci

      # No second test run (decision 0011): CI's own result for this exact commit on
      # the release branch is the gate, read before anything is built or published.
      - name: Check the commit is on a release branch and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --event push --json status,conclusion,url \
            | node scripts/release-gate.ts "$GITHUB_REF" "$GITHUB_SHA"

      - name: Set the version on the trierarch and the aeolus-fleet plugin
        env:
          VERSION: ${{ inputs.version }}
        run: npm run set-version -- "$VERSION"

      - run: npm run build

      # The milestone "trierarch <version>" is the release's scope: open issues in it
      # stop the run before anything is published. A hotfix without one goes on.
      # A lookup that fails fails the run (shell: bash adds pipefail).
      - name: Check the release's milestone has no open issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          MILESTONE="trierarch $VERSION"
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
            | jq -r --arg title "$MILESTONE" '.[] | select(.title == $title) | .number')
          if [[ -z "$number" ]]; then
            echo "No milestone named '$MILESTONE': going on without one." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?milestone=$number&state=open&per_page=100" \
            | jq -r '.[] | "#\(.number) \(.title)"')
          if [[ -n "$open" ]]; then
            echo "::error::Milestone '$MILESTONE' has open issues, nothing is published:"
            echo "$open"
            exit 1
          fi
          echo "Milestone '$MILESTONE' has no open issues." | tee -a "$GITHUB_STEP_SUMMARY"

      # Catches a problem in the package before it is published. A dry run
      # refuses a version on npm already too, so it skips it, as the publish
      # step below does.
      - name: Dry run
        env:
          PACKAGE: '@aeolus-fleet/trierarch'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --dry-run --access public --workspace "$PACKAGE"
          fi

      # Built before anything is published, so a broken image stops the release
      # first. The plugin in it carries the version set above.
      - name: Build the session image
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/aeolus-session:$VERSION"
          podman build --file packages/trierarch/image/Containerfile --build-arg VERSION="$VERSION" --tag "$IMAGE" .
          echo "SESSION_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Attested before anything is published, so a binary that cannot be attested
      # stops the release first. One attestation per binary.
      - uses: actions/download-artifact@v8
        with:
          pattern: aeolus-trierarch-*
          path: ${{ runner.temp }}/binaries
          merge-multiple: true
      - name: SHA256SUMS of the Go binaries
        working-directory: ${{ runner.temp }}/binaries
        run: |
          sha256sum aeolus-trierarch-* > SHA256SUMS
          cat SHA256SUMS
          for name in aeolus-trierarch-linux-amd64 aeolus-trierarch-linux-arm64 aeolus-trierarch-darwin-arm64 aeolus-trierarch-darwin-amd64; do
            grep --quiet "  $name\$" SHA256SUMS || { echo "::error::No $name was built"; exit 1; }
          done
      - name: Attest aeolus-trierarch-linux-amd64
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/binaries/aeolus-trierarch-linux-amd64
      - name: Attest aeolus-trierarch-linux-arm64
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/binaries/aeolus-trierarch-linux-arm64
      - name: Attest aeolus-trierarch-darwin-arm64
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/binaries/aeolus-trierarch-darwin-arm64
      - name: Attest aeolus-trierarch-darwin-amd64
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/binaries/aeolus-trierarch-darwin-amd64
      - name: Each Go binary's attestation verifies as signed by this file
        working-directory: ${{ runner.temp }}/binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for binary in aeolus-trierarch-*; do
            gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      # Skips a version on npm already, so releasing a version again after it
      # failed before its tag pushes the image again and tags it. Dispatch it
      # again from main: Re-run jobs replays the failed run's own copy of this
      # file.
      - name: Publish @aeolus-fleet/trierarch
        env:
          PACKAGE: '@aeolus-fleet/trierarch'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public --workspace "$PACKAGE"
          fi

      # After the package is on npm, before the tag: releasing a version again
      # after it failed partway pushes the image again, which replaces it.
      - name: Push the session image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printenv GH_TOKEN | podman login ghcr.io --username "$ACTOR" --password-stdin
          podman push "$SESSION_IMAGE"

      # After the package is on npm. The tag holds the released commit with the
      # plugin's manifests at the version on top (set above), off main's
      # history, so a harness installing the plugin from the tag gets the
      # plugin of that version under its version. If this step fails, push the
      # tag by hand and dispatch finish-release.yml with this run's id: the
      # version is already published and cannot be released again.
      - name: Tag v${{ inputs.version }}, the released commit with the plugin's version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --message "chore(release): the aeolus-fleet plugin is $VERSION" -- plugins/aeolus-fleet/.claude-plugin/plugin.json plugins/aeolus-fleet/.codex-plugin/plugin.json plugins/aeolus-fleet/.github/plugin/plugin.json
          git tag "v$VERSION" HEAD
          git push origin "refs/tags/v$VERSION"

  # The run's own binaries, which the job above attested, go on the GitHub Release.
  finish:
    name: Finish ${{ inputs.version }}
    needs: release
    uses: ./.github/workflows/finish-release.yml
    with:
      version: ${{ inputs.version }}
      run-id: ${{ github.run_id }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
