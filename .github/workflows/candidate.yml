# Builds the versioned plugin and tested Go binaries for the staging gate.
name: Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version the candidate will be released as, MAJOR.MINOR.PATCH
        required: true
        type: string

permissions:
  contents: read
  # To read CI's result for the candidate's commit.
  actions: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  binaries:
    name: Go binaries ${{ inputs.version }}
    uses: ./.github/workflows/go-binaries.yml
    with:
      version: ${{ inputs.version }}

  candidate:
    name: Candidate ${{ inputs.version }}
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The version it is released as: a plugin's core version check reads only a plain version.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the version is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag v$VERSION already exists: that version was released before"
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Could not read the tags from origin (git ls-remote exited $status)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Branch candidates can be inspected before merging; release keeps its branch gate.
      - name: Check the commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --json status,conclusion,url \
            | jq --exit-status '.[0] | .status == "completed" and .conclusion == "success"'

      - name: Set the version on the trierarch and the aeolus-fleet plugin
        env:
          VERSION: ${{ inputs.version }}
        run: npm run set-version -- "$VERSION"

      - uses: actions/download-artifact@v8
        with:
          pattern: aeolus-trierarch-*
          path: ${{ runner.temp }}/candidate
          merge-multiple: true

      - name: Pack the aeolus-fleet plugin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          tar --exclude=test -czf "$RUNNER_TEMP/candidate/aeolus-fleet-plugin-$VERSION.tgz" plugins/aeolus-fleet .claude-plugin .agents/plugins
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, writeFileSync } from "node:fs";
            const version = process.env.VERSION;
            const filename = `aeolus-fleet-plugin-${version}.tgz`;
            const folder = `${process.env.RUNNER_TEMP}/candidate`;
            const manifest = readdirSync(folder).sort().map((file) => ({
              name: file === filename ? "aeolus-fleet-plugin" : file,
              version,
              filename: file,
              integrity: `sha512-${createHash("sha512").update(readFileSync(`${folder}/${file}`)).digest("base64")}`,
            }));
            writeFileSync(`${folder}/integrity.json`, JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Name the candidate
        id: name
        env:
          VERSION: ${{ inputs.version }}
        run: echo "name=$VERSION-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ runner.temp }}/candidate/*.tgz
            ${{ runner.temp }}/candidate/integrity.json
          if-no-files-found: error
